name: CI

on:
  pull_request:
    paths:
      - "src/OmsLoan.Domain/**"
      - "src/OmsLoan.Worker/**"
      - "src/Directory.Build.props"
      - "tests/OmsLoan.Domain.Tests/**"
      - "tests/OmsLoan.Worker.Tests/**"
      - "OmsLoan.sln"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Restore, build, test (Worker path)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: >
          dotnet restore
          src/OmsLoan.Domain/OmsLoan.Domain.csproj
          src/OmsLoan.Worker/OmsLoan.Worker.csproj
          tests/OmsLoan.Domain.Tests/OmsLoan.Domain.Tests.csproj
          tests/OmsLoan.Worker.Tests/OmsLoan.Worker.Tests.csproj

      - name: Build
        run: >
          dotnet build
          src/OmsLoan.Worker/OmsLoan.Worker.csproj
          tests/OmsLoan.Domain.Tests/OmsLoan.Domain.Tests.csproj
          tests/OmsLoan.Worker.Tests/OmsLoan.Worker.Tests.csproj
          -c Release --no-restore

      - name: Test
        run: >
          dotnet test
          tests/OmsLoan.Domain.Tests/OmsLoan.Domain.Tests.csproj
          tests/OmsLoan.Worker.Tests/OmsLoan.Worker.Tests.csproj
          -c Release --no-build --verbosity normal

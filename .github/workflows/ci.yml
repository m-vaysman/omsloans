name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "OmsLoan.sln"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Restore, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore OmsLoan.sln

      - name: Build
        run: dotnet build OmsLoan.sln -c Release --no-restore

      - name: Test
        run: dotnet test OmsLoan.sln -c Release --no-build --verbosity normal

name: CI

on:
  pull_request:
    paths:
      - "src/OmsLoan.Domain/**"
      - "src/OmsLoan.Worker/**"
      - "src/Directory.Build.props"
      - "tests/OmsLoan.Domain.Tests/**"
      - "tests/OmsLoan.Worker.Tests/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (Worker path)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # One project per command — MSBuild rejects multiple project args on restore/build.
      # Domain.Tests / Worker.Tests pull Domain + Worker; Api and Web are not referenced.
      - name: Test Domain
        run: dotnet test tests/OmsLoan.Domain.Tests/OmsLoan.Domain.Tests.csproj -c Release --verbosity normal

      - name: Test Worker
        run: dotnet test tests/OmsLoan.Worker.Tests/OmsLoan.Worker.Tests.csproj -c Release --verbosity normal

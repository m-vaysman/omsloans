name: Deploy Worker

# Manual only — no push-to-main rebuild.
# Worker path only — Api / Web not built or published.
# Runs on windows-latest: publish target is a Windows Service, and Worker tests
# assume Windows file-share semantics (Linux CI falsely fails folder-lock cases).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-worker:
    name: Publish OmsLoan.Worker artifact
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test Domain
        run: dotnet test tests/OmsLoan.Domain.Tests/OmsLoan.Domain.Tests.csproj -c Release --verbosity normal

      - name: Test Worker
        run: dotnet test tests/OmsLoan.Worker.Tests/OmsLoan.Worker.Tests.csproj -c Release --verbosity normal

      - name: Publish Worker
        run: >
          dotnet publish src/OmsLoan.Worker/OmsLoan.Worker.csproj
          -c Release
          -o "${{ github.workspace }}/publish/OmsLoan.Worker"

      - name: Upload Worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmsLoan.Worker-${{ github.run_number }}
          path: ${{ github.workspace }}/publish/OmsLoan.Worker
          if-no-files-found: error
          retention-days: 14

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omsloan}
      POSTGRES_USER: ${POSTGRES_USER:-omsloan}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Named volume survives `docker compose down`. Wipe with `docker volume rm omsloan-postgres`.
      - omsloan-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  omsloan-postgres:
    name: omsloan-postgres
